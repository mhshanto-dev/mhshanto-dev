<svg width="1600" height="600" viewBox="0 0 1600 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="leftPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#132038"/>
    </linearGradient>
    <linearGradient id="rightBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF4FF"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1600" height="600" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Right side background -->
    <rect x="0" y="0" width="1600" height="600" fill="url(#rightBg)"/>

    <!-- Left dark panel (diagonal edge) -->
    <path d="M0 0 H520 L430 600 H0 Z" fill="url(#leftPanel)"/>

    <!-- decorative soft circles on right -->
    <circle cx="1500" cy="80" r="140" fill="#DCEBFF" opacity="0.6"/>
    <circle cx="1550" cy="520" r="180" fill="#E4EEFF" opacity="0.6"/>
    <circle cx="900" cy="540" r="90" fill="#DCEBFF" opacity="0.4"/>

    <!-- dotted accents -->
    <g fill="#1D6FE0" opacity="0.35">
      <circle cx="470" cy="60" r="3"/><circle cx="490" cy="60" r="3"/><circle cx="510" cy="60" r="3"/>
      <circle cx="470" cy="80" r="3"/><circle cx="490" cy="80" r="3"/><circle cx="510" cy="80" r="3"/>
      <circle cx="470" cy="100" r="3"/><circle cx="490" cy="100" r="3"/><circle cx="510" cy="100" r="3"/>
    </g>

    <!-- LEFT PANEL CONTENT -->
    <text x="60" y="110" font-size="15" letter-spacing="4" fill="#5FA8FF" font-weight="700">FULL STACK DEVELOPER</text>

    <text x="58" y="185" font-size="54" font-weight="800" fill="#FFFFFF">MD. MEHEDI</text>
    <text x="58" y="245" font-size="54" font-weight="800" fill="#FFFFFF">HASAN</text>
    <text x="58" y="305" font-size="54" font-weight="800" fill="#5FA8FF">SHANTO</text>

    <rect x="60" y="335" width="260" height="4" rx="2" fill="#5FA8FF"/>

    <text x="60" y="380" font-size="18" fill="#C7D3E8">Building modern, scalable and</text>
    <text x="60" y="404" font-size="18" fill="#C7D3E8">user-focused MERN applications.</text>

    <!-- Tech pills -->
    <g font-size="14" font-weight="700">
      <rect x="60" y="430" width="98" height="34" rx="17" fill="#123A1E"/>
      <text x="109" y="452" fill="#7CC66E" text-anchor="middle">MongoDB</text>

      <rect x="168" y="430" width="98" height="34" rx="17" fill="#1B2740"/>
      <text x="217" y="452" fill="#9DB6E8" text-anchor="middle">Express</text>

      <rect x="276" y="430" width="80" height="34" rx="17" fill="#0B2A4A"/>
      <text x="316" y="452" fill="#61DAFB" text-anchor="middle">React</text>

      <rect x="366" y="430" width="90" height="34" rx="17" fill="#123A1E"/>
      <text x="411" y="452" fill="#7CC66E" text-anchor="middle">Node.js</text>

      <rect x="60" y="474" width="110" height="34" rx="17" fill="#1B2740"/>
      <text x="115" y="496" fill="#9DB6E8" text-anchor="middle">TypeScript</text>

      <rect x="180" y="474" width="110" height="34" rx="17" fill="#0B2A4A"/>
      <text x="235" y="496" fill="#7DB3FA" text-anchor="middle">Next.js</text>

      <rect x="300" y="474" width="130" height="34" rx="17" fill="#1B2740"/>
      <text x="365" y="496" fill="#9DB6E8" text-anchor="middle">Tailwind CSS</text>
    </g>

    <!-- GitHub link row -->
    <circle cx="72" cy="545" r="16" fill="#1D6FE0"/>
    <text x="72" y="551" font-size="15" text-anchor="middle">🐙</text>
    <text x="98" y="550" font-size="15" fill="#FFFFFF" font-weight="700">Explore my code on <tspan fill="#5FA8FF">GitHub →</tspan></text>

    <!-- RIGHT SIDE CONTENT -->
    <!-- code icon -->
    <rect x="1470" y="55" width="66" height="66" rx="14" fill="#1D6FE0"/>
    <text x="1503" y="99" font-size="26" fill="#FFFFFF" text-anchor="middle" font-weight="700">&lt;/&gt;</text>

    <!-- code editor window -->
    <rect x="600" y="70" width="260" height="170" rx="12" fill="#0B1220"/>
    <rect x="600" y="70" width="260" height="26" rx="12" fill="#1B2740"/>
    <circle cx="618" cy="83" r="4" fill="#F87171"/>
    <circle cx="634" cy="83" r="4" fill="#FBBF24"/>
    <circle cx="650" cy="83" r="4" fill="#34D399"/>
    <rect x="618" y="112" width="100" height="7" rx="3" fill="#5FE3A6"/>
    <rect x="618" y="130" width="160" height="7" rx="3" fill="#7DB3FA"/>
    <rect x="618" y="148" width="80" height="7" rx="3" fill="#F5F5F5"/>
    <rect x="618" y="166" width="130" height="7" rx="3" fill="#5FE3A6"/>
    <rect x="618" y="184" width="70" height="7" rx="3" fill="#7DB3FA"/>
    <rect x="618" y="202" width="110" height="7" rx="3" fill="#F5F5F5"/>

    <!-- TS badge -->
    <circle cx="600" cy="260" r="26" fill="#0B2A4A"/>
    <text x="600" y="267" font-size="17" fill="#7DB3FA" text-anchor="middle" font-weight="700">TS</text>

    <!-- next.js text -->
    <text x="1470" y="180" font-size="24" fill="#0B1220" text-anchor="middle" font-weight="700">NEXT<tspan font-size="13" fill="#6B7688">.JS</tspan></text>

    <!-- person with laptop illustration -->
    <ellipse cx="1150" cy="530" rx="170" ry="18" fill="#DCEBFF"/>
    <circle cx="1130" cy="260" r="36" fill="#1B2740"/>
    <path d="M1074 530 C1074 430, 1096 340, 1130 305 C1164 340, 1186 430, 1186 530 Z" fill="#4E86E8"/>
    <rect x="1050" y="430" width="160" height="100" rx="16" fill="#111827"/>
    <rect x="1062" y="440" width="136" height="72" rx="6" fill="#1E293B"/>
    <rect x="1074" y="452" width="60" height="6" rx="3" fill="#5FE3A6"/>
    <rect x="1074" y="466" width="90" height="6" rx="3" fill="#7DB3FA"/>
    <rect x="1074" y="480" width="40" height="6" rx="3" fill="#F5F5F5"/>

    <!-- small plant -->
    <circle cx="960" cy="510" r="14" fill="#2E7D32"/>
    <rect x="953" y="516" width="14" height="16" fill="#8B5E3C"/>

    <!-- Feature chips top right of right panel -->
    <g font-size="15" font-weight="700" fill="#0B1220">
      <text x="900" y="330">&lt;/&gt;  Clean Code</text>
      <text x="900" y="356" font-size="12" font-weight="400" fill="#6B7688">Best Practices</text>

      <text x="1100" y="330">🛡  Secure &amp; Scalable</text>
      <text x="1100" y="356" font-size="12" font-weight="400" fill="#6B7688">Applications</text>
    </g>
  </g>

  <rect x="1" y="1" width="1598" height="598" rx="18" fill="none" stroke="#D9E4F5" stroke-width="1"/>
</svg>
