    <rect x="1450" y="60" width="70" height="70" rx="14" fill="#1D6FE0"/>
    <text x="1485" y="107" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="700">{ }</text>

    <rect x="1560" y="130" width="220" height="150" rx="10" fill="#0B1220"/>
    <rect x="1560" y="130" width="220" height="24" rx="10" fill="#1B2740"/>
    <circle cx="1575" cy="142" r="4" fill="#F87171"/>
    <circle cx="1590" cy="142" r="4" fill="#FBBF24"/>
    <circle cx="1605" cy="142" r="4" fill="#34D399"/>
    <rect x="1575" y="165" width="90" height="6" rx="3" fill="#5FE3A6"/>
    <rect x="1575" y="180" width="140" height="6" rx="3" fill="#7DB3FA"/>
    <rect x="1575" y="195" width="70" height="6" rx="3" fill="#F5F5F5"/>
    <rect x="1575" y="210" width="110" height="6" rx="3" fill="#5FE3A6"/>
    <rect x="1575" y="225" width="60" height="6" rx="3" fill="#7DB3FA"/>

    <circle cx="1420" cy="160" r="34" fill="#1D6FE0"/>
    <text x="1420" y="169" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">TS</text>

    <text x="1560" y="330" font-size="26" fill="#0B1220" text-anchor="start" font-weight="700" letter-spacing="1">NEXT<tspan font-size="14" fill="#6B7688">.JS</tspan></text>

    <!-- simple person with laptop -->
    <ellipse cx="1320" cy="470" rx="150" ry="18" fill="#DCEBFF"/>
    <circle cx="1300" cy="230" r="34" fill="#1B2740"/>
    <path d="M1250 470 C1250 380, 1270 300, 1300 270 C1330 300, 1350 380, 1350 470 Z" fill="#4E86E8"/>
    <rect x="1230" y="380" width="140" height="90" rx="16" fill="#111827"/>
    <rect x="1240" y="388" width="120" height="66" rx="6" fill="#1E293B"/>
    <circle cx="1180" cy="500" r="12" fill="#2E7D32"/>
    <rect x="1174" y="505" width="12" height="60" fill="#2E7D32"/>
  </g>

  <!-- Bottom bar -->
  <rect x="60" y="555" width="1480" height="60" rx="30" fill="url(#darkbar)"/>
  <circle cx="115" cy="585" r="18" fill="#FFFFFF"/>
  <text x="115" y="592" font-size="18" text-anchor="middle">🐙</text>
  <text x="150" y="580" font-size="17" fill="#FFFFFF" font-weight="700">Explore my code on <tspan fill="#7DB3FA">GitHub</tspan> →</text>

  <text x="580" y="580" font-size="15" fill="#E5E7EB">Building scalable, modern web applications with <tspan fill="#7DB3FA" font-weight="700">clean code</tspan> and <tspan fill="#5FE3A6" font-weight="700">great UX</tspan>.</text>

  <text x="1330" y="580" font-size="15" fill="#E5E7EB">Ideas to <tspan fill="#5FE3A6" font-weight="700">Impact</tspan> · Code to <tspan fill="#5FE3A6" font-weight="700">Create</tspan></text>
</svg>
