<svg width="1600" height="640" viewBox="0 0 1600 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF4FF"/>
    </linearGradient>
    <linearGradient id="darkbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0F1C33"/>
    </linearGradient>
    <clipPath id="clipCanvas"><rect x="0" y="0" width="1600" height="640" rx="0"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="1600" height="640" fill="url(#bg)"/>

  <g clip-path="url(#clipCanvas)" opacity="0.55">
    <circle cx="80" cy="60" r="180" fill="#DCEBFF"/>
    <circle cx="60" cy="560" r="220" fill="#E4EEFF"/>
    <circle cx="1540" cy="600" r="160" fill="#E4EEFF"/>
    <path d="M0 640 C 150 520, 250 560, 380 640 Z" fill="#DCEBFF"/>
  </g>

  <!-- decorative dotted grids -->
  <g fill="#B9CFF2">
    <circle cx="20" cy="20" r="3"/><circle cx="40" cy="20" r="3"/><circle cx="60" cy="20" r="3"/>
    <circle cx="20" cy="40" r="3"/><circle cx="40" cy="40" r="3"/><circle cx="60" cy="40" r="3"/>
    <circle cx="20" cy="60" r="3"/><circle cx="40" cy="60" r="3"/><circle cx="60" cy="60" r="3"/>
    <circle cx="1540" cy="500" r="3"/><circle cx="1560" cy="500" r="3"/><circle cx="1580" cy="500" r="3"/>
    <circle cx="1540" cy="520" r="3"/><circle cx="1560" cy="520" r="3"/><circle cx="1580" cy="520" r="3"/>
    <circle cx="1540" cy="540" r="3"/><circle cx="1560" cy="540" r="3"/><circle cx="1580" cy="540" r="3"/>
  </g>

  <!-- Left stack: tech icons -->
  <g font-size="24" font-weight="700" text-anchor="middle">
    <line x1="120" y1="110" x2="120" y2="410" stroke="#C7D8F5" stroke-width="2" stroke-dasharray="2 6"/>

    <circle cx="120" cy="100" r="34" fill="#0F3D2E"/>
    <text x="120" y="109" fill="#5FE3A6" font-size="26">🍃</text>
    <text x="170" y="93" font-size="21" font-weight="700" fill="#0F1C33" text-anchor="start">MongoDB</text>
    <text x="170" y="115" font-size="16" fill="#6B7688" text-anchor="start">Database</text>

    <circle cx="120" cy="200" r="34" fill="#111111"/>
    <text x="120" y="209" fill="#FFFFFF" font-size="20" font-weight="700">ex</text>
    <text x="170" y="193" font-size="21" font-weight="700" fill="#0F1C33" text-anchor="start">Express.js</text>
    <text x="170" y="215" font-size="16" fill="#6B7688" text-anchor="start">Backend</text>

    <circle cx="120" cy="300" r="34" fill="#0B2A4A"/>
    <text x="120" y="309" fill="#61DAFB" font-size="24">⚛</text>
    <text x="170" y="293" font-size="21" font-weight="700" fill="#1D6FE0" text-anchor="start">React</text>
    <text x="170" y="315" font-size="16" fill="#6B7688" text-anchor="start">Frontend</text>

    <circle cx="120" cy="400" r="34" fill="#123A1E"/>
    <text x="120" y="409" fill="#7CC66E" font-size="20" font-weight="700">JS</text>
    <text x="170" y="393" font-size="21" font-weight="700" fill="#2E7D32" text-anchor="start">Node.js</text>
    <text x="170" y="415" font-size="16" fill="#6B7688" text-anchor="start">Runtime</text>
