  <rect x="605" y="358" width="390" height="46" rx="23" fill="#FFFFFF" stroke="#B9CFF2" stroke-width="1.5"/>
  <text x="800" y="388" font-size="21" letter-spacing="4" text-anchor="middle" font-weight="700">
    <tspan fill="#2E7D32">MERN</tspan><tspan fill="#0B1220"> STACK DEVELOPER</tspan>
  </text>

  <!-- Tech line -->
  <text x="800" y="440" font-size="21" text-anchor="middle" fill="#2B3345">
    <tspan fill="#2E7D32" font-weight="700">MongoDB</tspan><tspan> | </tspan>
    <tspan fill="#0B1220" font-weight="700">Express.js</tspan><tspan> | </tspan>
    <tspan fill="#1D6FE0" font-weight="700">React</tspan><tspan> | </tspan>
    <tspan fill="#2E7D32" font-weight="700">Node.js</tspan><tspan> | </tspan>
    <tspan fill="#0B1220" font-weight="700">JavaScript</tspan><tspan> | </tspan>
    <tspan fill="#1D6FE0" font-weight="700">TypeScript</tspan><tspan> | </tspan>
    <tspan fill="#0B1220" font-weight="700">Tailwind CSS</tspan>
  </text>

  <!-- Feature row -->
  <g font-size="18" font-weight="700" fill="#0B1220">
    <text x="465" y="497">&lt;/&gt;</text>
    <text x="500" y="493">Clean Code</text>
    <text x="500" y="515" font-size="14" font-weight="400" fill="#6B7688">Best Practices</text>

    <text x="665" y="497">🛡</text>
    <text x="700" y="493">Secure &amp; Scalable</text>
    <text x="700" y="515" font-size="14" font-weight="400" fill="#6B7688">Applications</text>

    <text x="905" y="497">🚀</text>
    <text x="940" y="493">Performance</text>
    <text x="940" y="515" font-size="14" font-weight="400" fill="#6B7688">Optimized</text>

    <text x="1105" y="497">☁</text>
    <text x="1140" y="493">Deploy Anywhere</text>
    <text x="1140" y="515" font-size="14" font-weight="400" fill="#6B7688">Vercel | Netlify</text>
  </g>

  <!-- Right illustration: laptop/dev -->
