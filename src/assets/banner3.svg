    <tspan fill="#0B1220">MD. MEHEDI </tspan><tspan fill="#1D6FE0">HASAN</tspan>
  </text>
  <text x="800" y="290" font-size="72" font-weight="800" fill="#0B1220" text-anchor="middle">SHANTO</text>

  <!-- Role -->
  <text x="800" y="335" font-size="27" letter-spacing="6" fill="#2B3345" text-anchor="middle" font-weight="700">FULL STACK DEVELOPER</text>

