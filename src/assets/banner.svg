<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    
    <!-- Code Accent Gradient -->
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Footer Bar Gradient -->
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="50%" stop-color="#101f42"/>
      <stop offset="100%" stop-color="#0a1128"/>
    </linearGradient>
    
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <drop-shadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <drop-shadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="370" fill="url(#bgGrad)" />

  <!-- Decorative Abstract Background Wave Shapes -->
  <path d="M 0,0 Q 150,80 200,0 Z" fill="#e2edff" opacity="0.4" />
  <path d="M 0,220 Q 80,260 0,320 Z" fill="#e2edff" opacity="0.5" />
  <circle cx="950" cy="80" r="120" fill="#e2edff" opacity="0.3" />
  
  <!-- Left Side Technology Circle Badges & Text -->
  <g transform="translate(40, 25)">
    <!-- MongoDB -->
    <circle cx="35" cy="35" r="24" fill="#111827" filter="url(#iconShadow)"/>
    <path d="M 35,21 C 35,21 27,29 27,36 C 27,43 32,47 35,49 C 35,49 35,49 35,49 C 35,49 35,49 35,49 C 38,47 43,43 43,36 C 43,29 35,21 35,21 Z" fill="#10B981" />
    <path d="M 35,21 L 35,49 C 35,49 35,49 35,49 C 38,47 43,43 43,36 C 43,29 35,21 35,21 Z" fill="#047857" opacity="0.3" />
    <text x="74" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" fill="#0f172a">MongoDB</text>
    <text x="74" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Database</text>

    <!-- Express.js -->
    <g transform="translate(0, 62)">
      <circle cx="35" cy="35" r="24" fill="#1e293b" filter="url(#iconShadow)"/>
      <text x="35" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" fill="#ffffff" text-anchor="middle">ex</text>
      <text x="74" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" fill="#0f172a">Express.js</text>
      <text x="74" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Backend</text>
    </g>

    <!-- React -->
    <g transform="translate(0, 124)">
      <circle cx="35" cy="35" r="24" fill="#0f172a" filter="url(#iconShadow)"/>
      <ellipse cx="35" cy="35" rx="14" ry="5" fill="none" stroke="#00d8ff" stroke-width="1.5" transform="rotate(0 35 35)"/>
      <ellipse cx="35" cy="35" rx="14" ry="5" fill="none" stroke="#00d8ff" stroke-width="1.5" transform="rotate(60 35 35)"/>
      <ellipse cx="35" cy="35" rx="14" ry="5" fill="none" stroke="#00d8ff" stroke-width="1.5" transform="rotate(120 35 35)"/>
      <circle cx="35" cy="35" r="2" fill="#00d8ff"/>
      <text x="74" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" fill="#0f172a">React</text>
      <text x="74" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Frontend</text>
    </g>

    <!-- Node.js -->
    <g transform="translate(0, 186)">
      <circle cx="35" cy="35" r="24" fill="#064e3b" filter="url(#iconShadow)"/>
      <text x="35" y="41" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#4ade80" text-anchor="middle">JS</text>
      <text x="74" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" fill="#0f172a">Node.js</text>
      <text x="74" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Runtime</text>
    </g>
  </g>

  <!-- Center Content Section -->
  <!-- Top Center Code Icon Custom Design -->
  <g transform="translate(485, 25)">
    <path d="M -15,10 L -28,0 L -15,-10 M 15,10 L 28,0 L 15,-10 M 5,-14 L -5,14" fill="none" stroke="url(#codeGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Developer Name Headings -->
  <text x="500" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">MD. MEHEDI HASAN</text>
  <text x="500" y="158" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" fill="#2563eb" text-anchor="middle" letter-spacing="0.5">SHANTO</text>
  
  <text x="500" y="192" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" fill="#334155" text-anchor="middle" letter-spacing="4">FULL STACK DEVELOPER</text>

  <!-- MERN Stack Pill Badge Layout -->
  <g transform="translate(500, 204)">
    <rect x="-105" y="0" width="210" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>
    <text x="0" y="17" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#1e293b" text-anchor="middle" letter-spacing="2">
      <tspan fill="#059669">MERN</tspan> STACK DEVELOPER
    </text>
  </g>

  <!-- Core In-line Tech Specialties Text Strip -->
  <text x="500" y="254" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#475569" text-anchor="middle">
    <tspan fill="#16a34a">MongoDB</tspan> | Express.js | <tspan fill="#2563eb">React</tspan> | <tspan fill="#16a34a">Node.js</tspan> | JavaScript | <tspan fill="#2563eb">TypeScript</tspan> | Tailwind CSS
  </text>

  <!-- Floating Right Mini Circles & Laptop Graphic Details -->
  <!-- {} Badge -->
  <g transform="translate(860, 35)" filter="url(#iconShadow)">
    <circle cx="20" cy="20" r="18" fill="#2563eb" />
    <text x="20" y="25" font-family="monospace" font-weight="bold" font-size="15" fill="#ffffff" text-anchor="middle">{}</text>
  </g>
  <!-- TS Badge -->
  <g transform="translate(815, 75)" filter="url(#iconShadow)">
    <circle cx="16" cy="16" r="15" fill="#3178c6" />
    <text x="16" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle">TS</text>
  </g>

  <!-- Cartoon Avatar Frame Mock Container Placeholder on Right Surface Area -->
  <g transform="translate(730, 95)">
    <!-- Abstract Tech Window Container Panel -->
    <rect x="75" y="10" width="110" height="75" rx="6" fill="#1e293b" filter="url(#shadow)"/>
    <circle cx="85" cy="18" r="3" fill="#ef4444" />
    <circle cx="93" cy="18" r="3" fill="#f59e0b" />
    <circle cx="101" cy="18" r="3" fill="#10b981" />
    <line x1="82" y1="28" x2="140" y2="28" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="82" y1="36" x2="160" y2="36" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <line x1="82" y1="44" x2="120" y2="44" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="82" y1="52" x2="150" y2="52" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Character Vector Shape Layer Components Layout -->
    <!-- Head Circle Profile Outline Base -->
    <circle cx="35" cy="35" r="18" fill="#1e293b" />
    <!-- Neck Connector Element -->
    <path d="M 31,52 L 39,52 L 37,60 L 33,60 Z" fill="#3b82f6" />
    <!-- Torso Shape Design Body Panel -->
    <path d="M 12,94 C 12,70 20,60 35,60 C 50,60 58,70 58,94 Z" fill="#3b82f6" />
    <!-- Laptop Box Deck Base Surface Shadow Base -->
    <rect x="5" y="86" width="60" height="32" rx="5" fill="#0f172a" />
    <rect x="9" y="90" width="52" height="24" rx="2" fill="#1e293b" />
    <!-- Laptop Screen Edge Fold Line Accent -->
    <line x1="5" y1="104" x2="65" y2="104" stroke="#334155" stroke-width="1.5" />
    
    <text x="125" y="110" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#0f172a" letter-spacing="1">NEXT.js</text>
  </g>

  <!-- Core Engineering Value Proposition Pillars Row Grid Setup Layout -->
  <g transform="translate(230, 280)">
    <!-- Clean Code -->
    <g transform="translate(0, 0)">
      <path d="M 5,6 L 0,2 L 5,-2 M 11,6 L 16,2 L 11,-2" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, 5)"/>
      <text x="22" y="10" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#0f172a">Clean Code</text>
      <text x="22" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">Best Practices</text>
    </g>

    <!-- Secure & Scalable -->
    <g transform="translate(135, 0)">
      <path d="M 2,6 C 2,6 2,2 6,2 C 10,2 10,6 10,6 L 10,8 L 2,8 Z M 0,8 L 12,8 L 12,15 L 0,15 Z" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round" transform="translate(0, 1)"/>
      <text x="18" y="10" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#0f172a">Secure &amp; Scalable</text>
      <text x="18" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">Applications</text>
    </g>

    <!-- Performance -->
    <g transform="translate(285, 0)">
      <path d="M 12,0 L 4,8 L 0,8 L 0,4 L 8,0 Z M 2,10 L 0,12 L 0,14 L 2,14 L 4,12 Z" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round" transform="translate(0, 1)"/>
      <text x="18" y="10" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#0f172a">Performance</text>
      <text x="18" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">Optimized</text>
    </g>

    <!-- Deploy Anywhere -->
    <g transform="translate(415, 0)">
      <path d="M 1,9 C 0,7 1,4 4,4 C 5,2 8,1 10,3 C 13,1 16,3 15,6 C 17,7 17,10 15,11 L 2,11 Z" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round" transform="translate(0, 2)"/>
      <text x="22" y="10" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#0f172a">Deploy Anywhere</text>
      <text x="22" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b">Vercel | Netlify</text>
    </g>
  </g>

  <!-- Bottom Dark Full-Width Decorative Footer Ribbon Bar Layout Base -->
  <g transform="translate(0, 325)">
    <rect x="25" y="0" width="950" height="32" rx="16" fill="url(#footerGrad)" filter="url(#shadow)" />
    
    <!-- GitHub Link Visual Box Indicator Anchor Placement -->
    <g transform="translate(45, 6)">
      <!-- GitHub Minimalist Mark Silhouette Silhouette Vector -->
      <path d="M 8,0 C 3.58,0 0,3.58 0,8 C 0,11.54 2.29,14.53 5.47,15.59 C 5.87,15.66 6.02,15.42 6.02,15.21 C 6.02,15.02 6.01,14.51 6.01,13.84 C 3.79,14.32 3.32,12.77 3.32,12.77 C 2.96,11.84 2.43,11.59 2.43,11.59 C 1.7,11.1 2.48,11.11 2.48,11.11 C 3.29,11.17 3.71,11.95 3.71,11.95 C 4.42,13.17 5.58,12.82 6.04,12.61 C 6.11,12.1 6.32,11.75 6.54,11.55 C 4.77,11.35 2.91,10.66 2.91,7.61 C 2.91,6.74 3.22,6.03 3.73,5.48 C 3.65,5.28 3.37,4.47 3.81,3.37 C 3.81,3.37 4.48,3.15 6,4.19 C 6.64,4.01 7.32,3.92 8,3.92 C 8.68,3.92 9.36,4.01 10,4.19 C 11.52,3.15 12.19,3.37 12.19,3.37 C 12.63,4.47 12.35,5.28 12.27,5.48 C 12.78,6.03 13.09,6.74 13.09,7.61 C 13.09,10.67 11.23,11.35 9.45,11.55 C 9.73,11.79 9.99,12.27 9.99,13.01 C 9.99,14.07 9.98,14.93 9.98,15.21 C 9.98,15.43 10.13,15.67 10.53,15.59 C 13.71,14.53 16,11.54 16,8 C 16,3.58 12.42,0 8,0 Z" fill="#ffffff"/>
      <text x="24" y="13" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#ffffff">Explore my code on GitHub →</text>
    </g>

    <!-- Center Pitch Tagline Text Block Content -->
    <text x="500" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#cbd5e1" text-anchor="middle">
      Building scalable, modern web applications with <tspan fill="#3b82f6">clean code</tspan> and <tspan fill="#10b981">great UX.</tspan>
    </text>

    <!-- Right Side Value Target Statements Info Blocks Summary -->
    <text x="940" y="19" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#ffffff" text-anchor="end">
      Ideas to <tspan fill="#10b981">Impact</tspan> · Code to <tspan fill="#3b82f6">Create</tspan>
    </text>
  </g>
</svg>
